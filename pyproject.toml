[project]
name = "amphion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argparse>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "openai>=2.52.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.2",
    "torch>=2.9.0",
    "transformers>=5.15.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
